[package]
name = "life-pixel-editor-wasm"
description = "The editor's engine: core and compiler behind wasm-bindgen, run in the editor's Web Worker"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
repository.workspace = true
license = "AGPL-3.0-only"

[lib]
# cdylib: the module `cargo xtask build-editor` hands to wasm-bindgen; rlib: the host tests.
crate-type = ["cdylib", "rlib"]

[dependencies]
life-pixel-compiler.workspace = true
life-pixel-core.workspace = true
serde.workspace = true
# The requests and answers of the worker, as JavaScript values rather than JSON text.
serde-wasm-bindgen.workspace = true
# Pixels, documents and exported files cross the boundary as `Uint8Array`, not arrays of numbers.
serde_bytes.workspace = true
serde_json.workspace = true
wasm-bindgen.workspace = true

[lints]
workspace = true
