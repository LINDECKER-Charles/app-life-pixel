[package]
name = "life-pixel-player"
description = "The Life Pixel player: plays a payload v1 through player ABI v1, as WebAssembly without wasm-bindgen"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
repository.workspace = true
license = "MIT"

[lib]
# `cdylib`: the WebAssembly module `cargo xtask build-player` builds; `rlib`: the host tests.
crate-type = ["cdylib", "rlib"]

[dependencies]
life-pixel-format.workspace = true

[dev-dependencies]
# The tests encode the animations they play; nothing that ships uses the encoder.
life-pixel-format = { workspace = true, features = ["encode"] }

# The workspace's lints, with `unsafe_code` relaxed from `forbid` to `deny`: the few items that
# need `unsafe` allow it one by one, each with a `// SAFETY:` comment that clippy requires.
[lints.rust]
missing_docs = "warn"
unsafe_code = "deny"

[lints.clippy]
cognitive_complexity = "warn"
expect_used = "warn"
too_many_arguments = "warn"
too_many_lines = "warn"
undocumented_unsafe_blocks = "deny"
unwrap_used = "warn"
