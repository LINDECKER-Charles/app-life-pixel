[package]
name = "life-pixel-service"
description = "The Life Pixel use cases and the storage ports they need"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
repository.workspace = true
license = "AGPL-3.0-only"

[features]
# The in-memory adapters and the contract suites, for this crate's tests and the adapters' own.
testing = []

[dependencies]
argon2.workspace = true
async-trait.workspace = true
base64.workspace = true
bytes.workspace = true
fd-lock.workspace = true
hmac.workspace = true
life-pixel-compiler.workspace = true
life-pixel-core.workspace = true
png.workspace = true
rand.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tempfile.workspace = true
thiserror.workspace = true
time = { workspace = true, features = ["formatting", "parsing", "serde"] }
tokio = { workspace = true, features = ["rt", "sync", "time"] }
tracing.workspace = true
uuid = { workspace = true, features = ["serde", "v7"] }
zip = { workspace = true, features = ["deflate-flate2-zlib-rs", "time"] }

[dev-dependencies]
# The crate itself with `testing`, so that `cargo test` runs the suites without a feature flag.
life-pixel-service = { path = ".", features = ["testing"] }
time = { workspace = true, features = ["macros"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
