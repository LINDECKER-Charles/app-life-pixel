[package]
name = "life-pixel-desktop"
description = "The Life Pixel desktop app: the editor packaged by Tauri, over a local library"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
repository.workspace = true
license = "AGPL-3.0-only"
default-run = "life-pixel-desktop"

# Tauri's layout: the app is a library, which the desktop binary runs and a mobile build will
# load; the binary is a one-line `main`.
[lib]
name = "life_pixel_desktop"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build.workspace = true

[dependencies]
async-trait.workspace = true
base64.workspace = true
bytes.workspace = true
life-pixel-service.workspace = true
serde.workspace = true
serde_json.workspace = true
tauri.workspace = true
tauri-plugin-dialog.workspace = true
tempfile.workspace = true
thiserror.workspace = true
time = { workspace = true, features = ["formatting", "serde"] }
tokio = { workspace = true, features = ["fs", "rt", "sync"] }
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter", "fmt", "std"] }
uuid.workspace = true

[dev-dependencies]
life-pixel-service = { workspace = true, features = ["testing"] }
tauri = { workspace = true, features = ["test"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
