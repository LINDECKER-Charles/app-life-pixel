<section id="overview" class="section" aria-labelledby="overview-title">
  <div class="section-heading">
    <span class="eyebrow" data-i18n="overview.eyebrow"></span>
    <span class="pill"><span class="status-dot"></span><span data-i18n="proposal"></span></span>
  </div>
  <div class="hero">
    <div class="hero-copy">
      <h1 id="overview-title" data-i18n="overview.title"></h1>
      <p class="hero-lead" data-i18n="overview.description"></p>
      <a class="button primary" href="#studio"
        ><span data-i18n="overview.action"></span> <span aria-hidden="true">↗</span></a
      >
      <p class="hero-caption" data-i18n="overview.caption"></p>
    </div>
    <div class="mascot-stage" role="img" data-i18n-label="mascot.alt">
      <div class="stage-grid"></div>
      <span class="stage-label" data-i18n="mascot.tag"></span>
      <span class="pixel-star star-one" aria-hidden="true">✦</span>
      <span class="pixel-star star-two" aria-hidden="true">✦</span>
      <div class="mascot-disc"></div>
      <img class="hero-mascot" src="../assets/pip.svg" alt="" />
      <span class="mascot-sticker" data-i18n="mascot.hello"></span>
      <div class="stage-footer"><span>PIP / 001</span><span>48 × 48 px</span></div>
    </div>
  </div>
  <div class="principles">
    <article>
      <span class="principle-index">01 /</span>
      <h2 data-i18n="principle.warm.title"></h2>
      <p data-i18n="principle.warm.body"></p>
    </article>
    <article>
      <span class="principle-index">02 /</span>
      <h2 data-i18n="principle.clear.title"></h2>
      <p data-i18n="principle.clear.body"></p>
    </article>
    <article>
      <span class="principle-index">03 /</span>
      <h2 data-i18n="principle.play.title"></h2>
      <p data-i18n="principle.play.body"></p>
    </article>
  </div>
  <div class="section-heading subsection">
    <div>
      <span class="eyebrow" data-i18n="palette.eyebrow"></span>
      <h2 data-i18n="palette.title"></h2>
    </div>
    <a class="text-link" href="#foundations" data-i18n="palette.action"></a>
  </div>
  <div class="palette-strip">
    <div class="palette-tile cream"><span data-i18n="color.cream"></span><code>#FFF8F5</code></div>
    <div class="palette-tile rose"><span data-i18n="color.rose"></span><code>#FFEDF1</code></div>
    <div class="palette-tile raspberry">
      <span data-i18n="color.raspberry"></span> <code>#A93663</code>
    </div>
    <div class="palette-tile mint"><span data-i18n="color.mint"></span><code>#DFF1E6</code></div>
    <div class="palette-tile ink"><span data-i18n="color.ink"></span><code>#382631</code></div>
  </div>
  <p class="small-note" data-i18n="palette.note"></p>
</section>
