<section id="foundations" class="section" aria-labelledby="foundations-title" hidden>
  <span class="eyebrow" data-i18n="foundations.eyebrow"></span>
  <h1 id="foundations-title" data-i18n="foundations.title"></h1>
  <p class="section-lead" data-i18n="foundations.description"></p>
  <div class="foundation-grid">
    <article class="specimen type-specimen">
      <span class="eyebrow" data-i18n="type.eyebrow"></span>
      <div class="type-large">Aa<span>♥</span></div>
      <h2>Nunito</h2>
      <p data-i18n="type.description"></p>
      <div class="alphabet">
        ABCDEFGHIJKLMNOPQRSTUVWXYZ<br />abcdefghijklmnopqrstuvwxyz<br />
        0123456789 · é à œ ç
      </div>
      <div class="type-scale">
        <span data-i18n="type.heading"></span><code>32 / 1.25 / 700</code>
      </div>
      <div class="type-scale"><span data-i18n="type.body"></span><code>16 / 1.6 / 400</code></div>
      <div class="type-scale"><span data-i18n="type.label"></span><code>14 / 1.35 / 600</code></div>
    </article>
    <article class="specimen">
      <span class="eyebrow" data-i18n="geometry.eyebrow"></span>
      <h2 data-i18n="geometry.title"></h2>
      <p data-i18n="geometry.description"></p>
      <div class="radius-specimens" aria-hidden="true">
        <span>8</span><span>14</span><span>20</span>
      </div>
      <div class="spacing-specimens" aria-hidden="true">
        <div><i style="width: 4px"></i><code>4</code></div>
        <div><i style="width: 8px"></i><code>8</code></div>
        <div><i style="width: 16px"></i><code>16</code></div>
        <div><i style="width: 24px"></i><code>24</code></div>
        <div><i style="width: 32px"></i><code>32</code></div>
        <div><i style="width: 48px"></i><code>48</code></div>
      </div>
      <p class="small-note" data-i18n="geometry.note"></p>
    </article>
  </div>
  <div class="section-heading subsection">
    <h2 data-i18n="tokens.title"></h2>
    <a class="text-link" href="../tokens/tokens.css" data-i18n="tokens.download"></a>
  </div>
  <div class="token-list">
    <div>
      <span class="token-dot token-bg"></span><span data-i18n="token.background"></span>
      <code>--lp-bg</code>
    </div>
    <div>
      <span class="token-dot token-accent"></span><span data-i18n="token.action"></span>
      <code>--lp-accent</code>
    </div>
    <div>
      <span class="token-dot token-text"></span><span data-i18n="token.text"></span>
      <code>--lp-text</code>
    </div>
    <div>
      <span class="token-dot token-focus"></span><span data-i18n="token.focus"></span>
      <code>--lp-focus</code>
    </div>
  </div>
  <div class="note-panel">
    <strong data-i18n="foundations.rule_title"></strong>
    <p data-i18n="foundations.rule_body"></p>
  </div>
</section>
