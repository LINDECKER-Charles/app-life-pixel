services:
  postgres:
    ports: ["127.0.0.1:5460:5432"]

  # H0 — S3-compatible object storage for local development.
  objectstore:
    image: adobe/s3mock@sha256:ab01a6946750f451ca215a47e91030695b260e4003b8a5a6201d25029b8fca92
    environment:
      COM_ADOBE_TESTING_S3MOCK_STORE_INITIAL_BUCKETS: life-pixel-local
    ports: ["127.0.0.1:5461:9090"]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:9090/"]
      interval: 5s
      timeout: 3s
      retries: 20
    deploy:
      resources:
        limits: { memory: 512M }
    restart: unless-stopped

  # H0 — mail catcher with an HTTP API for local development.
  mail:
    image: axllent/mailpit@sha256:74d609a42ec279aa63c6b4622a6fa9b5408d1ad5b1d76a1c4be40a265ce0863d
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"
    ports: ["127.0.0.1:5462:1025", "127.0.0.1:5463:8025"]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8025/readyz"]
      interval: 5s
      timeout: 3s
      retries: 20
    deploy:
      resources:
        limits: { memory: 128M }
    restart: unless-stopped

  # H14 — the app's images, started only with `docker compose --profile app up`, built from the
  # repository. What differs inside a container replaces .env's host values: the image's
  # listeners and folders, and the stack's addresses on the project's network.
  server:
    profiles: [app]
    build:
      context: .
      dockerfile: docker/app.Dockerfile
    ports: ["127.0.0.1:8460:8080", "127.0.0.1:8461:9090"]
    environment:
      LP_HTTP_ADDR: 0.0.0.0:8080
      LP_METRICS_ADDR: 0.0.0.0:9090
      LP_ADMIN_API_ADDR: 0.0.0.0:9091
      LP_APP_DIR: /srv/app
      LP_I18N_DIR: /srv/i18n
      LP_DATABASE_URL: postgres://life_pixel:${LP_DB_PASSWORD}@postgres:5432/life_pixel
      LP_S3_ENDPOINT: http://objectstore:9090
      LP_SMTP_URL: smtp://mail:1025
    depends_on:
      objectstore: { condition: service_healthy }
      mail: { condition: service_healthy }

  admin:
    profiles: [app]
    build:
      context: .
      dockerfile: docker/admin.Dockerfile
    ports: ["127.0.0.1:8463:8080", "127.0.0.1:8464:9090"]
    environment:
      LPA_HTTP_ADDR: 0.0.0.0:8080
      LPA_METRICS_ADDR: 0.0.0.0:9090
      LPA_APP_DIR: /srv/admin
      LPA_I18N_DIR: /srv/i18n
      LPA_DATABASE_URL: postgres://life_pixel_admin:${LPA_DB_PASSWORD}@postgres:5432/life_pixel_admin
      LPA_SERVER_ADMIN_API_URL: http://server:9091/internal/admin/v1
