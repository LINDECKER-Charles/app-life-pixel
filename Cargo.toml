[workspace]
members = ["crates/*", "xtask"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
publish = false
repository = "https://github.com/LINDECKER-Charles/app-life-pixel"

[workspace.dependencies]
# One line per dependency, sorted. Each task adds those it uses.
anyhow = "1.0.104"
base64 = "0.23.1"
cargo_metadata = "0.23.1"
clap = { version = "4.6.7", features = ["derive"] }
gif = { version = "0.14.2", default-features = false, features = ["std"] }
life-pixel-core = { path = "crates/core" }
life-pixel-format = { path = "crates/format" }
png = { version = "0.18.1", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
thiserror = "2.0.21"
wasmi = { version = "2.0.0", default-features = false, features = ["std", "validate"] }
zip = { version = "8.6.0", default-features = false }

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[workspace.lints.clippy]
cognitive_complexity = "warn"
expect_used = "warn"
too_many_arguments = "warn"
too_many_lines = "warn"
unwrap_used = "warn"

[profile.player]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
