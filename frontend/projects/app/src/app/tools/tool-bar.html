<div class="group" role="group" [attr.aria-label]="'tools.group.drawing' | transloco">
  @for (definition of tools; track definition.tool) {
    <button
      type="button"
      class="lp-icon-button tool"
      [attr.aria-label]="definition.labelKey | transloco"
      [attr.aria-pressed]="tool() === definition.tool"
      [attr.aria-keyshortcuts]="definition.shortcutKey"
      [lpTooltip]="definition.labelKey | transloco"
      [lpTooltipShortcut]="definition.shortcut"
      (click)="selectTool(definition.tool)"
    >
      <lp-icon [name]="definition.icon" size="large" />
    </button>
    @if (definition.tool === 'rectangle') {
      <!-- The rectangle's own switch, right after it: filled or outlined. -->
      <button
        type="button"
        class="lp-icon-button tool filled"
        [attr.aria-label]="'tools.shortcut.rectangle_filled' | transloco"
        [attr.aria-pressed]="rectangleFilled()"
        aria-keyshortcuts="Shift+R"
        [lpTooltip]="'tools.shortcut.rectangle_filled' | transloco"
        [lpTooltipShortcut]="shortcut.filled"
        (click)="toggleFilled()"
      >
        <lp-icon name="rectangle-filled" size="large" />
      </button>
    }
  }
</div>
<div class="group" role="group" [attr.aria-label]="'tools.group.history' | transloco">
  <button
    type="button"
    class="lp-icon-button"
    [attr.aria-label]="'tools.undo' | transloco"
    [disabled]="!engine.state().canUndo"
    aria-keyshortcuts="Control+Z Meta+Z"
    [lpTooltip]="'tools.undo' | transloco"
    [lpTooltipShortcut]="shortcut.undo"
    (click)="engine.undo()"
  >
    <lp-icon name="undo" size="large" />
  </button>
  <button
    type="button"
    class="lp-icon-button"
    [attr.aria-label]="'tools.redo' | transloco"
    [disabled]="!engine.state().canRedo"
    aria-keyshortcuts="Control+Shift+Z Meta+Shift+Z Control+Y"
    [lpTooltip]="'tools.redo' | transloco"
    [lpTooltipShortcut]="shortcut.redo"
    (click)="engine.redo()"
  >
    <lp-icon name="redo" size="large" />
  </button>
</div>
<div class="group" role="group" [attr.aria-label]="'tools.group.import' | transloco">
  <lp-import-image-button />
  <lp-import-sprite-sheet-button />
</div>
<div class="group">
  <button
    type="button"
    class="lp-icon-button"
    [attr.aria-label]="'tools.shortcuts_button' | transloco"
    aria-keyshortcuts="?"
    [lpTooltip]="'tools.shortcuts_button' | transloco"
    [lpTooltipShortcut]="shortcut.help"
    (click)="help.open()"
  >
    <lp-icon name="help" size="large" />
  </button>
</div>
<lp-shortcuts-help-dialog />
