<div class="options">
  <div class="field">
    <label for="export-tag">{{ 'export.options.tag' | transloco }}</label>
    <select id="export-tag" #tagField [value]="tag() ?? ''" (change)="onTagChange(tagField.value)">
      <option value="">{{ 'export.options.tag_all' | transloco }}</option>
      @for (item of tags(); track item.name) {
        <option [value]="item.name">{{ item.name }}</option>
      }
    </select>
  </div>
  <div class="field">
    <label for="export-scale">{{ 'export.options.scale' | transloco }}</label>
    <input
      #scaleField
      id="export-scale"
      type="number"
      inputmode="numeric"
      step="1"
      [min]="bounds().min"
      [max]="bounds().max"
      [value]="scale()"
      [attr.aria-describedby]="'export-scale-hint'"
      (change)="onScaleChange(scaleField)"
    />
    <p id="export-scale-hint" class="hint">
      {{ 'export.options.scale_hint' | transloco: bounds() }}
    </p>
  </div>
</div>
