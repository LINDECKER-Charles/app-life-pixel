<main class="page">
  <h1>{{ 'auth.reset_password_confirm.title' | transloco }}</h1>
  @if (done()) {
    <p role="status">{{ 'auth.reset_password_confirm.success' | transloco }}</p>
    <a routerLink="/sign-in">{{ 'auth.reset_password_confirm.sign_in_link' | transloco }}</a>
  } @else {
    <form novalidate (submit)="submit($event)">
      @if (form.of('form'); as error) {
        <p #formBanner class="banner" role="alert" tabindex="-1">
          {{ 'errors.' + error.code | transloco: error.params }}
        </p>
      }
      <lp-password-field
        #passwordField
        [label]="'auth.reset_password_confirm.password_label' | transloco"
        autocomplete="new-password"
        [maxChars]="limits.passwordMaxChars"
        [value]="password()"
        [errorText]="errorText('password')"
        (valueChange)="password.set($event)"
      />
      <button type="submit" class="primary" [disabled]="pending()">
        {{ 'auth.reset_password_confirm.submit' | transloco }}
      </button>
    </form>
  }
</main>
