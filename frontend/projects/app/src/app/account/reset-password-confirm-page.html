<ion-content>
  <div class="lp-page lp-page--reading account-form-page">
    <header class="lp-page-header">
      <div class="lp-page-header__text">
        <h1 class="lp-page-header__title">
          {{ 'auth.reset_password_confirm.title' | transloco }}
        </h1>
      </div>
    </header>
    @if (done()) {
      <lp-status-banner variant="success">
        <p>{{ 'auth.reset_password_confirm.success' | transloco }}</p>
      </lp-status-banner>
      <p>
        <a class="lp-button lp-button--primary" routerLink="/sign-in">
          {{ 'auth.reset_password_confirm.sign_in_link' | transloco }}
        </a>
      </p>
    } @else {
      <form class="lp-card lp-stack account-form" novalidate (submit)="submit($event)">
        <lp-error-summary [entries]="form.entries()" [targets]="targets" />
        <lp-password-field
          [fieldId]="id('password')"
          [label]="'auth.reset_password_confirm.password_label' | transloco"
          [hint]="
            'auth.sign_up.password_hint'
              | transloco: { min: limits.passwordMinChars, max: limits.passwordMaxChars }
          "
          autocomplete="new-password"
          [maxChars]="limits.passwordMaxChars"
          [value]="password()"
          [error]="form.of('password')"
          (valueChange)="onPassword($event)"
        />
        <button
          type="submit"
          class="lp-button lp-button--primary account-form__submit"
          [attr.aria-busy]="pending() ? 'true' : null"
        >
          {{ 'auth.reset_password_confirm.submit' | transloco }}
        </button>
      </form>
    }
  </div>
</ion-content>
