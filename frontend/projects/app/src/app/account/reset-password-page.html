<main class="page">
  <h1>{{ 'auth.reset_password.title' | transloco }}</h1>
  @if (sent()) {
    <p role="status">{{ 'auth.reset_password.sent' | transloco }}</p>
  } @else {
    <form novalidate (submit)="submit($event)">
      @if (form.of('form'); as error) {
        <p #formBanner class="banner" role="alert" tabindex="-1">
          {{ 'errors.' + error.code | transloco: error.params }}
        </p>
      }
      <ion-input
        [label]="'auth.reset_password.email_label' | transloco"
        labelPlacement="stacked"
        type="email"
        autocomplete="email"
        [attr.maxlength]="limits.emailMaxChars"
        [value]="email()"
        (ionInput)="onEmailInput($event)"
      />
      <button type="submit" class="primary" [disabled]="pending()">
        {{ 'auth.reset_password.submit' | transloco }}
      </button>
    </form>
  }
  <p>
    <a routerLink="/sign-in">{{ 'auth.reset_password.sign_in_link' | transloco }}</a>
  </p>
</main>
