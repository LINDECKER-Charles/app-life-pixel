<main class="page">
  <h1>{{ 'auth.sign_in.title' | transloco }}</h1>
  <form novalidate (submit)="submit($event)">
    @if (form.of('form'); as error) {
      <p #formBanner class="banner" role="alert" tabindex="-1">
        {{ 'errors.' + error.code | transloco: error.params }}
      </p>
    }
    <ion-input
      #emailField
      [label]="'auth.sign_in.email_label' | transloco"
      labelPlacement="stacked"
      type="email"
      autocomplete="email"
      [attr.maxlength]="limits.emailMaxChars"
      [value]="email()"
      [errorText]="errorText('email')"
      [class.ion-invalid]="!!form.of('email')"
      [class.ion-touched]="!!form.of('email')"
      (ionInput)="onEmailInput($event)"
    />
    <lp-password-field
      #passwordField
      [label]="'auth.sign_in.password_label' | transloco"
      autocomplete="current-password"
      [value]="password()"
      [errorText]="errorText('password')"
      (valueChange)="password.set($event)"
    />
    <p>
      <a routerLink="/reset-password">{{ 'auth.sign_in.forgot_password' | transloco }}</a>
    </p>
    <button type="submit" class="primary" [disabled]="pending()">
      {{ 'auth.sign_in.submit' | transloco }}
    </button>
  </form>
  <p>
    {{ 'auth.sign_in.no_account' | transloco }}
    <a routerLink="/sign-up" [queryParams]="{ returnUrl: returnUrl() }">
      {{ 'auth.sign_in.sign_up_link' | transloco }}
    </a>
  </p>
</main>
