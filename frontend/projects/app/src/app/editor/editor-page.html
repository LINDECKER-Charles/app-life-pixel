<div class="editor" [class.inspector-closed]="!inspectorOpen()">
  <header class="docbar">
    <h1 class="lp-visually-hidden">{{ 'editor.heading' | transloco }}</h1>
    <div class="document">
      <lp-animation-title class="title" />
      <lp-save-state-pill />
      <lp-open-status />
    </div>
    <div class="actions">
      <!-- Between 48 and 75 rem only (editor-page.scss): folds the inspector away. -->
      <button
        type="button"
        class="lp-button lp-button--quiet inspector-toggle"
        [attr.aria-controls]="id('inspector')"
        [attr.aria-expanded]="inspectorOpen()"
        (click)="inspectorOpen.set(!inspectorOpen())"
      >
        <lp-icon [name]="inspectorOpen() ? 'chevron-right' : 'chevron-left'" />
        {{ 'editor.inspector.label' | transloco }}
      </button>
      <button
        type="button"
        class="lp-button lp-button--secondary new"
        (click)="newAnimation.start()"
      >
        <lp-icon name="plus" />
        {{ 'editor.new.action' | transloco }}
      </button>
      <lp-save-button />
      <lp-export-button />
    </div>
  </header>
  <section class="region rail" [attr.aria-label]="'editor.region.tools' | transloco">
    <lp-tool-bar />
  </section>
  <section class="region stage" [attr.aria-label]="'editor.region.canvas' | transloco">
    <lp-canvas class="canvas" [attr.inert]="showWelcome() ? '' : null" />
    @if (showWelcome()) {
      <lp-editor-welcome class="welcome" />
    }
  </section>
  <section class="region timeline" [attr.aria-label]="'editor.region.timeline' | transloco">
    <lp-timeline />
  </section>
  <div [id]="id('inspector')" class="inspector">
    @if (tabbed()) {
      <lp-inspector-tabs
        class="tabs"
        [tabs]="inspectorTabs"
        [label]="'editor.inspector.label' | transloco"
        [(selected)]="inspectorPanel"
      />
    }
    <!-- Sections with a heading each; tabbed, panels of which one shows at a time. -->
    <section
      [id]="id('inspector-palette-panel')"
      class="panel"
      [attr.role]="tabbed() ? 'tabpanel' : null"
      [attr.aria-labelledby]="panelLabel('inspector-palette-panel', 'inspector-palette')"
      [hidden]="isPanelHidden('inspector-palette-panel')"
    >
      <h2 [id]="id('inspector-palette')" class="panel-title" [class.lp-visually-hidden]="tabbed()">
        {{ 'editor.region.palette' | transloco }}
      </h2>
      <lp-palette-panel />
    </section>
    <section
      [id]="id('inspector-layers-panel')"
      class="panel"
      [attr.role]="tabbed() ? 'tabpanel' : null"
      [attr.aria-labelledby]="panelLabel('inspector-layers-panel', 'inspector-layers')"
      [hidden]="isPanelHidden('inspector-layers-panel')"
    >
      <h2 [id]="id('inspector-layers')" class="panel-title" [class.lp-visually-hidden]="tabbed()">
        {{ 'timeline.layers.heading' | transloco }}
      </h2>
      <lp-layer-list />
    </section>
    <section
      [id]="id('inspector-playback-panel')"
      class="panel"
      [attr.role]="tabbed() ? 'tabpanel' : null"
      [attr.aria-labelledby]="panelLabel('inspector-playback-panel', 'inspector-playback')"
      [hidden]="isPanelHidden('inspector-playback-panel')"
    >
      <h2 [id]="id('inspector-playback')" class="panel-title" [class.lp-visually-hidden]="tabbed()">
        {{ 'timeline.playback.heading' | transloco }}
      </h2>
      <lp-playback-preview />
    </section>
  </div>
</div>
<lp-new-animation-dialog />
