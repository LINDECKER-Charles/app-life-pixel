<div class="editor">
  <header class="docbar">
    <h1 class="lp-visually-hidden">{{ 'editor.heading' | transloco }}</h1>
    <div class="document">
      <lp-animation-title class="title" />
      <lp-save-state-pill />
      <lp-open-status />
    </div>
    <div class="actions">
      <button
        type="button"
        class="lp-button lp-button--secondary new"
        (click)="newAnimation.start()"
      >
        <lp-icon name="plus" />
        {{ 'editor.new.action' | transloco }}
      </button>
      <lp-save-button />
      <lp-export-button />
    </div>
  </header>
  <section class="region rail" [attr.aria-label]="'editor.region.tools' | transloco">
    <lp-tool-bar />
  </section>
  <section class="region stage" [attr.aria-label]="'editor.region.canvas' | transloco">
    <lp-canvas class="canvas" [attr.inert]="showWelcome() ? '' : null" />
    @if (showWelcome()) {
      <lp-editor-welcome class="welcome" />
    }
  </section>
  <div class="inspector">
    <section class="panel" aria-labelledby="inspector-palette">
      <h2 id="inspector-palette" class="panel-title">{{ 'editor.region.palette' | transloco }}</h2>
      <lp-palette-panel />
    </section>
    <section class="panel" aria-labelledby="inspector-layers">
      <h2 id="inspector-layers" class="panel-title">{{ 'timeline.layers.heading' | transloco }}</h2>
      <lp-layer-list />
    </section>
    <section class="panel" aria-labelledby="inspector-playback">
      <h2 id="inspector-playback" class="panel-title">
        {{ 'timeline.playback.heading' | transloco }}
      </h2>
      <lp-playback-preview />
    </section>
  </div>
  <section class="region timeline" [attr.aria-label]="'editor.region.timeline' | transloco">
    <lp-timeline />
  </section>
</div>
<lp-new-animation-dialog />
