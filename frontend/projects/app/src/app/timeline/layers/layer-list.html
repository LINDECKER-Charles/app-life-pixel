@if (document()) {
  <div class="toolbar">
    <button
      type="button"
      class="lp-button lp-button--quiet lp-button--compact add"
      (click)="addLayer()"
    >
      <lp-icon name="plus" size="small" />
      {{ 'timeline.layers.add' | transloco }}
    </button>
  </div>
  <ul class="layers" role="list">
    @for (layer of layers(); track layer.id; let index = $index) {
      @let active = layer.id === editor.activeLayer();
      <li
        class="layer"
        [class.active]="active"
        [attr.data-layer]="layer.id"
        draggable="true"
        (dragstart)="onDragStart(index)"
        (dragover)="$event.preventDefault()"
        (drop)="onDrop(index)"
      >
        <button
          type="button"
          class="lp-icon-button lp-button--compact visibility"
          [attr.aria-pressed]="layer.visible"
          [attr.aria-label]="'timeline.layers.show' | transloco: { name: layer.name }"
          (click)="toggleVisibility(layer.id, layer.visible)"
        >
          <lp-icon [name]="layer.visible ? 'eye' : 'eye-off'" />
        </button>
        @if (renaming() === layer.id) {
          <input
            #nameField
            class="lp-input lp-input--compact name-field"
            type="text"
            autocomplete="off"
            [value]="layer.name"
            [attr.aria-label]="'timeline.layers.rename_label' | transloco"
            [attr.maxlength]="limits()?.nameMaxChars"
            (blur)="finishRename(layer.id, nameField, false)"
            (keydown.enter)="finishRename(layer.id, nameField, true)"
            (keydown.escape)="cancelRename(layer.id)"
          />
        } @else {
          <button
            type="button"
            class="select"
            [attr.aria-current]="active ? 'true' : null"
            aria-describedby="layer-reorder-hint"
            (click)="activate(layer.id)"
            (dblclick)="startRename(layer.id)"
            (keydown)="onKeydown(index, $event)"
          >
            <span class="name">{{ layer.name }}</span>
            @if (active || !layer.visible) {
              <span class="states">
                @if (active) {
                  <span class="state state--active">{{
                    'timeline.layers.active' | transloco
                  }}</span>
                }
                @if (!layer.visible) {
                  <span class="state">{{ 'timeline.layers.hidden' | transloco }}</span>
                }
              </span>
            }
          </button>
        }
        <button
          type="button"
          class="lp-icon-button lp-button--compact rename"
          [attr.aria-label]="'timeline.layers.rename' | transloco: { name: layer.name }"
          (click)="startRename(layer.id)"
        >
          <lp-icon name="edit" />
        </button>
        <button
          type="button"
          class="lp-icon-button lp-button--compact delete"
          [disabled]="layers().length <= 1"
          [attr.aria-label]="'timeline.layers.delete' | transloco: { name: layer.name }"
          (click)="deleteLayer(layer.id)"
        >
          <lp-icon name="trash" />
        </button>
      </li>
    }
  </ul>
  <p id="layer-reorder-hint" class="lp-visually-hidden">
    {{ 'timeline.layers.reorder_hint' | transloco }}
  </p>
} @else {
  <p class="empty">{{ 'editor.empty.hint' | transloco }}</p>
}
