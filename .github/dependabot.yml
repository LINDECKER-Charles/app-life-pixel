version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    groups:
      actions: { patterns: ["*"] }
  - package-ecosystem: cargo
    directory: /
    schedule: { interval: weekly }
    groups:
      cargo: { patterns: ["*"] }
  - package-ecosystem: npm
    directory: /frontend
    schedule: { interval: weekly }
    groups:
      frontend: { patterns: ["*"] }
  - package-ecosystem: npm
    directory: /player-js
    schedule: { interval: weekly }
    groups:
      player-js: { patterns: ["*"] }
  - package-ecosystem: docker-compose
    directory: /
    schedule: { interval: weekly }
