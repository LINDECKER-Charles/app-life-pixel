name: Pull request
# The conventions of CLAUDE.md that live outside the code: the title — the squash commit's
# subject —, the branch's name, and a warning when the change grows too large to review. `edited`
# runs it again once the title is fixed.
on:
  pull_request:
    branches: [dev]
    types: [opened, edited, reopened, synchronize]
permissions: {}
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  conventions:
    name: Conventions
    # Dependabot names its own branches and titles.
    if: github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      # Through the environment, never interpolated into the script: the title is user input.
      - name: Check the title, the branch and the size
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BRANCH: ${{ github.event.pull_request.head.ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/ci/check-pull-request.mjs
