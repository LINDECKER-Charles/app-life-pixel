name: Verify
on:
  workflow_call:
permissions: {}
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  # F1: cmp CLAUDE.md AGENTS.md, actionlint on .github/workflows/.
  repository:
    name: Repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Compare CLAUDE.md and AGENTS.md
        run: cmp CLAUDE.md AGENTS.md
      - name: Lint workflows with actionlint
        run: |
          docker run --rm -v "$PWD":/repo -w /repo \
            rhysd/actionlint:latest@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 \
            -color
  # F2: formatting, lints, tests and the licence boundary of the Cargo workspace. T1 adds Tauri's
  # Linux system packages.
  rust:
    name: Rust
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # T1: the workspace compiles tauri/, which links WebKitGTK and its companions.
      - name: Install Tauri's system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libxdo-dev libssl-dev librsvg2-dev
      - name: Install the pinned toolchain
        run: |
          rustup toolchain install
          rustup show
      - name: Cache Cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Lint
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace
      - name: Check the licence boundary
        run: cargo xtask check-boundaries
  # P1: the decoder fuzzed 60 seconds on the nightly toolchain; fuzz.yml fuzzes it 30 minutes
  # every week.
  fuzz-smoke:
    name: Fuzz smoke
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: crates/format
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the nightly toolchain
        run: rustup toolchain install nightly --profile minimal
      - name: Cache Cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: crates/format/fuzz
      - name: Install cargo-fuzz
        run: cargo +nightly install cargo-fuzz --version 0.13.2 --locked
      - name: Seed the corpus with the v1 fixture
        run: mkdir -p fuzz/corpus/decode && cp tests/fixtures/v1/sample.lpix fuzz/corpus/decode/
      - name: Fuzz for 60 seconds
        run: cargo +nightly fuzz run decode -- -max_total_time=60
      - name: Keep the failing input
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-smoke-artifacts
          path: crates/format/fuzz/artifacts/decode
          if-no-files-found: ignore

  # F2 adds `rust`, H4 adds `rust-stack`, P1 adds `fuzz-smoke`, P2 adds `player`, L1 adds
  # `player-js`, F3 adds `frontend`, H3 adds `api`, U6 adds `e2e-editor`, H17 adds `e2e-hosted`,
  # H14 adds `docker`, A5 adds `mcp`, T1/T5 add `desktop` — each in its own job, added next to
  # this one without editing it.

  # P2: the WebAssembly player built reproducibly, its hash checked against player.sha256, its
  # 16 KiB budget, and the v1 fixture played frame by frame in wasmi.
  player:
    name: Player
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the pinned toolchain
        run: |
          rustup toolchain install
          rustup show
      - name: Cache Cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Build and check the player
        run: cargo xtask build-player --check
      - name: Keep the module that failed
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: player-module
          path: target/player/wasm32-unknown-unknown/player/life_pixel_player.wasm
          if-no-files-found: ignore

  # F3: npm ci, lint, test:ci, build, i18n:check, then the checks of the tools and the bundle.
  # W1: the editor's engine built once, before them — LP_ENGINE_PREBUILT=1 lets the scripts skip
  # their prebuild —, W0's contract suite against it in Chromium (test:engine), and its two
  # outputs kept as the `engine` artifact, rooted at frontend/projects/app/, for the jobs that
  # serve the app.
  frontend:
    name: Front-end
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: frontend
    env:
      LP_ENGINE_PREBUILT: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the pinned toolchain
        run: |
          rustup toolchain install
          rustup show
      - name: Cache Cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Install the wasm-bindgen of Cargo.lock
        run: |
          version="$(cargo pkgid --locked wasm-bindgen)"
          cargo install wasm-bindgen-cli --version "${version##*@}" --locked
      - name: Build the editor's engine
        run: cargo xtask build-editor
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm run test:ci
      - name: Tests of the tools
        run: npm run test:tools
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium
      - name: Engine tests
        run: npm run test:engine
      - name: Keep the screenshots of the engine tests that failed
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: engine-test-screenshots
          path: frontend/.vitest/attachments
          if-no-files-found: ignore
      - name: Build
        run: npm run build
      - name: Check the catalogues
        run: npm run i18n:check
      - name: Check that no catalogue is bundled
        run: npm run i18n:check-bundle
      - name: Keep the engine
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: engine
          path: |
            frontend/projects/app/src/app/engine/wasm/generated/
            frontend/projects/app/public/engine/
          if-no-files-found: error

  # L1: npm ci, build then check that the committed life-pixel.js is current, the Playwright tests
  # on the fake player, the size budget of the loader.
  player-js:
    name: Player loader
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: player-js
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: player-js/package-lock.json
      - name: Install
        run: npm ci
      - name: Build
        run: npm run build
      - name: Check that the committed build is current
        run: git diff --exit-code -- life-pixel.js
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium
      - name: Tests
        run: npm test
      - name: Check the size budget
        run: npm run size

  # H3: the server's API description and its TypeScript types regenerated, then compared with
  # the committed ones.
  api:
    name: API description
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the pinned toolchain
        run: |
          rustup toolchain install
          rustup show
      - name: Cache Cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: Regenerate the description and its types
        run: npm run api:generate
      - name: Check that the committed ones are current
        run: git diff --exit-code -- ../crates/server/openapi.json projects/shared/src/lib/api/schema.d.ts

  # H4: the server against the local stack — Postgres, S3Mock and Mailpit — started from
  # `.env.example`, then the tests behind the `stack-tests` feature. H11 adds
  # `-p life-pixel-admin-server`; the packages are named, so that `tauri/` is not compiled here.
  rust-stack:
    name: Rust on the local stack
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the pinned toolchain
        run: |
          rustup toolchain install
          rustup show
      - name: Cache Cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Configure the local stack
        run: cp .env.example .env
      - name: Start the local stack
        run: docker compose up -d --wait
      - name: Test against the local stack
        run: cargo test -p life-pixel-server --features stack-tests
      - name: Show the stack's logs
        if: failure()
        run: docker compose logs --no-color

  # T1: the desktop app built in debug and bundled as a .deb by `cargo xtask build-desktop`, with
  # Tauri's system packages and CLI, and the engine the `frontend` job built. T5 adds tauri-driver,
  # WebKitGTK's WebDriver and its smoke test under Xvfb.
  desktop:
    name: Desktop
    runs-on: ubuntu-latest
    needs: frontend
    permissions:
      contents: read
    env:
      LP_ENGINE_PREBUILT: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Tauri's system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libxdo-dev libssl-dev librsvg2-dev
      - name: Install the pinned toolchain
        run: |
          rustup toolchain install
          rustup show
      - name: Cache Cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Install the Tauri CLI
        run: cargo install tauri-cli --version ^2 --locked
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install the front-end
        run: npm ci --prefix frontend
      - name: Download the engine
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: engine
          path: frontend/projects/app
      - name: Build the desktop app
        run: cargo xtask build-desktop --debug

  # U6: the editor's end-to-end path in Chromium — draw, animate, export, then play the export
  # with its loader —, the same drawing with the keyboard alone, and axe on the editor's screens.
  # Playwright serves the app with `npm start`, on the engine the `frontend` job built.
  e2e-editor:
    name: Editor end to end
    runs-on: ubuntu-latest
    needs: frontend
    permissions:
      contents: read
    defaults:
      run:
        working-directory: frontend
    env:
      LP_ENGINE_PREBUILT: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: Download the engine
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: engine
          path: frontend/projects/app
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium
      - name: End-to-end tests
        run: npm run e2e
      - name: Keep the report and the traces of the tests that failed
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-editor-report
          path: |
            frontend/playwright-report/
            frontend/e2e/editor/test-results/
          if-no-files-found: ignore
