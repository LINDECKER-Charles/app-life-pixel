name: Promote
# H14: tags the images CI built from a commit as :prod, without rebuilding them: production runs
# the very images staging ran. Called by ci.yml on a push to `main`.
on:
  workflow_call:
    inputs:
      sha:
        description: The commit whose :<sha> images become :prod
        type: string
        required: true
permissions: {}
jobs:
  promote:
    name: Promote the images
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tag :<sha> as :prod
        env:
          SHA: ${{ inputs.sha }}
        run: |
          for image in app admin; do
            repository="ghcr.io/lindecker-charles/life-pixel/$image"
            docker buildx imagetools create --tag "$repository:prod" "$repository:$SHA"
          done
