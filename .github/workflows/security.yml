name: Security
on:
  pull_request:
    branches: [dev]
  # Not `main`: it only fast-forwards to a commit already analysed on its push to `dev`, and the
  # weekly run analyses `dev` again with the advisories published since.
  push:
    branches: [dev]
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:
permissions: {}
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  # The languages to analyse (scripts/ci/verification-scope.mjs): on a pull request, those whose
  # sources changed; on a push or a scheduled run, all of them.
  scope:
    name: Scope
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      codeql: ${{ steps.scope.outputs.codeql }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - name: Detect what the change calls for
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/ci/detect-scope.mjs

  # F1. F2 adds `rust`, F3 adds `javascript-typescript`: the languages and their sources live in
  # verification-scope.mjs.
  codeql:
    name: CodeQL (${{ matrix.language }})
    needs: scope
    if: needs.scope.outputs.codeql != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: ${{ fromJSON(needs.scope.outputs.codeql) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Initialize CodeQL
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: ${{ matrix.language }}
          build-mode: none
      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: /language:${{ matrix.language }}

  # F1.
  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Dependency review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
          # As deny.toml's ignores: advisories Tauri 2 pulls in on Linux, with no upgrade yet.
          # GHSA-wrw7-89jp-8q8g: glib 0.18's VariantStrIter, unsound, through gtk-rs — fixed in
          # glib 0.20, which Tauri's gtk 0.18 cannot take; nothing here iterates a GVariant.
          allow-ghsas: GHSA-wrw7-89jp-8q8g

  # F2: the dependency policy of deny.toml — advisories, licences, bans, sources.
  cargo-deny:
    name: cargo deny
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check dependencies
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check

  # F3. L1 adds `player-js`, one directory per line.
  npm-audit:
    name: npm audit (${{ matrix.directory }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        directory:
          - frontend
          - player-js
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - name: Audit the dependencies
        working-directory: ${{ matrix.directory }}
        run: npm audit --audit-level=moderate

  # F2 adds `cargo-deny`, F3 and L1 add `npm-audit`, each in its own job.
