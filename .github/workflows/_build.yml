name: Build
# H14: builds the `app` and `admin` images of a commit once, pushes them as :<sha> and :staging,
# and attests their provenance. Called by ci.yml after the promotion to `test`.
on:
  workflow_call:
    inputs:
      sha:
        description: The commit to build, whose images are tagged :<sha>
        type: string
        required: true
permissions: {}
jobs:
  image:
    name: Image ${{ matrix.image }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      matrix:
        image: [app, admin]
    env:
      IMAGE: ghcr.io/lindecker-charles/life-pixel/${{ matrix.image }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha }}
          persist-credentials: false
      - name: Read the wasm-bindgen of Cargo.lock
        id: bindgen
        run: |
          version="$(awk '$0 == "name = \"wasm-bindgen\"" { getline; gsub(/"/, "", $3); print $3; exit }' Cargo.lock)"
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/${{ matrix.image }}.Dockerfile
          # Only the app builds the editor's engine with wasm-bindgen.
          build-args: >-
            ${{ matrix.image == 'app'
            && format('WASM_BINDGEN_VERSION={0}', steps.bindgen.outputs.version) || '' }}
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ inputs.sha }}
            ${{ env.IMAGE }}:staging
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,scope=${{ matrix.image }},mode=max
      - name: Attest the provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
